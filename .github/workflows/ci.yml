name: Full Pipeline

on:
  push:
    branches: [ main ]

jobs:

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run ui-tests

  bdd-tests:
    runs-on: ubuntu-latest
    needs: ui-tests
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run bdd

  add-tests:
    runs-on: ubuntu-latest
    needs: bdd-tests
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run test:add -- --coverage

      - name: Upload ADD report
        uses: actions/upload-artifact@v4
        with:
          name: add-report
          path: coverage/
          retention-days: 28

  build:
    runs-on: ubuntu-latest
    needs: add-tests
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Deploying application..."